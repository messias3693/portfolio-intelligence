<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Zen · Lluvia Azul Japonesa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030611; /* Fondo azul noche ultra oscuro */
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Controles de interfaz minimalista */
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .btn-audio {
            padding: 14px 28px;
            background: rgba(12, 22, 44, 0.65);
            border: 1px solid rgba(0, 140, 255, 0.25);
            border-radius: 30px;
            color: #8dafff;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-audio:hover {
            background: rgba(0, 110, 255, 0.15);
            border-color: rgba(0, 170, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.3);
        }
        .instruction {
            color: rgba(141, 175, 255, 0.35);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div id="ui-container">
        <button class="btn-audio" id="audioBtn">Activar Sonido de Naturaleza</button>
        <div class="instruction">Lluvia digital en cámara lenta</div>
    </div>

    <script>
        // ─── CONFIGURACIÓN DEL CANVAS (LLUVIA DIGITAL AZUL) ────────────────────────
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Caracteres Japoneses (Katakana y Kanji asociados con la calma y elementos naturales)
        const japaneseChars = '🌸🌊🌌🎋🪷明静和穏空海風光水美夜生流禅息融庵寂';
        const alphabet = japaneseChars.split('');

        const fontSize = 18;
        let columns = canvas.width / fontSize;
        let rainDrops = [];

        function initRain() {
            columns = canvas.width / fontSize;
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                // Posiciones de inicio escalonadas verticalmente para evitar un inicio en bloque uniforme
                rainDrops[x] = Math.random() * -canvas.height / fontSize;
            }
        }
        initRain();
        window.addEventListener('resize', initRain);

        // Gradiente de tonos azules pausados
        const bluePalette = [
            '#00f0ff', // Cian luminoso (efecto destello en la punta de la gota)
            '#3a86ff', // Azul claro relajante
            '#0055ff', // Azul medio
            '#0033aa', // Azul cobalto apagado
            '#0a1944'  // Azul de rastro profundo
        ];

        // Temporizador estricto para ralentizar la animación (Efecto Slow Motion)
        let lastTime = 0;
        const targetFps = 10; // Velocidad muy baja para inducir calma
        const interval = 1000 / targetFps;

        function draw(timestamp) {
            requestAnimationFrame(draw);

            // Filtro de fotogramas por segundo controlado
            const delta = timestamp - lastTime;
            if (delta < interval) return;
            lastTime = timestamp - (delta % interval);

            // Fondo translúcido persistente para generar estelas largas y sutiles
            ctx.fillStyle = 'rgba(3, 6, 17, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                
                // Asignación de color con probabilidad para preservar el flujo orgánico
                const rand = Math.random();
                if (rand > 0.97) {
                    ctx.fillStyle = '#ffffff'; // Destello blanco tenue e intermitente
                } else if (rand > 0.75) {
                    ctx.fillStyle = bluePalette[0]; // Cian brillante
                } else if (rand > 0.40) {
                    ctx.fillStyle = bluePalette[1]; // Azul claro
                } else {
                    ctx.fillStyle = bluePalette[2]; // Azul medio/profundo
                }

                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                ctx.fillText(text, x, y);

                // Reinicio de la gota cuando sale de la pantalla con un retraso aleatorio
                if (y > canvas.height && Math.random() > 0.98) {
                    rainDrops[i] = 0;
                }
                
                // Desplazamiento amortiguado (no todas las columnas bajan al mismo tiempo)
                if (Math.random() > 0.35) {
                    rainDrops[i]++;
                }
            }
        }

        requestAnimationFrame(draw);

        // ─── AUDIO SINTÉTICO (DISEÑO DE AUDIO DE LLUVIA NATURAL) ───────────────
        let audioCtx = null;
        let isPlaying = false;
        let rainSource = null;
        const audioBtn = document.getElementById('audioBtn');

        function createRainSound() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Generación de un buffer de ruido rosa (más cálido y natural que el ruido blanco estándar)
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            let b0, b1, b2, b3, b4, b5, b6;
            b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
            
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.12; // Normalización de volumen de salida
                b6 = white * 0.115926;
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            // Filtro pasa-bajas para transformar el ruido en el sonido sordo de una llovizna cayendo
            const lowpassFilter = audioCtx.createBiquadFilter();
            lowpassFilter.type = 'lowpass';
            lowpassFilter.frequency.setValueAtTime(1000, audioCtx.currentTime); // Frecuencia de corte baja para suavidad

            // Control de ganancia (Volumen tenue e inmersivo)
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

            // Conexión del grafo de audio
            noiseNode.connect(lowpassFilter);
            lowpassFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
            return noiseNode;
        }

        audioBtn.addEventListener('click', () => {
            if (!isPlaying) {
                if (!audioCtx) {
                    rainSource = createRainSound();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                audioBtn.textContent = 'Pausar Ambiente';
                audioBtn.style.borderColor = 'rgba(0, 200, 255, 0.6)';
                isPlaying = true;
            } else {
                if (audioCtx) {
                    audioCtx.suspend();
                }
                audioBtn.textContent = 'Activar Sonido de Naturaleza';
                audioBtn.style.borderColor = 'rgba(0, 140, 255, 0.25)';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
